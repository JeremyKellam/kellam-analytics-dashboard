name: Database Backup

on:
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday at 6am UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        run: |
          docker run --rm postgres:17 pg_dump "${{ secrets.DATABASE_URL_BACKUP }}" \
            --no-owner --no-acl --clean --if-exists \
            > backup.sql
          gzip backup.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: kellam-analytics-backup-${{ github.run_started_at }}
          path: backup.sql.gz
          retention-days: 90

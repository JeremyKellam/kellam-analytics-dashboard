name: Database Backup

on:
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday at 6am UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client-17
        run: |
          sudo apt-get install -y gnupg wget
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/apt/PGAPT.pub | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        run: |
          pg_dump "${{ secrets.DATABASE_URL_BACKUP }}" \
            --no-owner --no-acl --clean --if-exists \
            -f backup.sql
          gzip backup.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: kellam-analytics-backup-${{ github.run_started_at }}
          path: backup.sql.gz
          retention-days: 90

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0a0f1e"/>

  <!-- K spine -->
  <line x1="30" y1="18" x2="30" y2="82" stroke="#f1f5f9" stroke-width="6" stroke-linecap="round"/>

  <!-- K arms (engineering cyan) -->
  <line x1="30" y1="50" x2="72" y2="18" stroke="#06b6d4" stroke-width="5" stroke-linecap="round"/>
  <line x1="30" y1="50" x2="72" y2="82" stroke="#06b6d4" stroke-width="5" stroke-linecap="round"/>

  <!-- Circuit nodes -->
  <circle cx="30" cy="50" r="5.5" fill="#06b6d4"/>
  <circle cx="72" cy="18" r="3.5" fill="#06b6d4" opacity="0.8"/>
  <circle cx="72" cy="82" r="3.5" fill="#06b6d4" opacity="0.8"/>
</svg>
